[package]
name = "snake-tauri"
version = "1.0.0"
description = "A modern Snake game with Tauri 2.0"
authors = ["bazheng"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
# Desktop-only: "staticlib"/"cdylib" are only needed for Tauri mobile and
# break fat LTO in the release profile below.
name = "snake_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size-focused release profile: this is where Tauri's small binaries come from.
# Thin LTO: fat LTO (`lto = true`) crashed rustc on Windows during development.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
