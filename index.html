<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake 2.0 - Tauri Edition</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
        touch-action: manipulation;
      }

      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 16px;
      }

      .game-header {
        text-align: center;
        color: white;
        margin-bottom: 12px;
      }

      .game-header h1 {
        font-size: 2.2em;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        margin-bottom: 4px;
      }

      .game-header .subtitle {
        font-size: 1em;
        opacity: 0.9;
      }

      .stats-bar {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-bottom: 12px;
        color: white;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.2);
        padding: 6px 18px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        text-align: center;
      }

      .stat-label {
        opacity: 0.8;
        font-size: 0.85em;
      }

      .stat-value {
        font-size: 1.4em;
        font-weight: bold;
      }

      #game-container {
        background: #1a1a2e;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
      }

      #game-area {
        outline: none;
      }

      /* Square board that scales with the window; the backing canvas stays
         500x500 and the browser scales it, so the game logic never changes. */
      #game-area canvas {
        display: block;
        width: min(500px, 92vw, calc(100vh - 260px));
        height: min(500px, 92vw, calc(100vh - 260px));
      }

      .controls {
        display: flex;
        gap: 15px;
        margin-top: 14px;
        justify-content: center;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
      }

      .notification {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px 50px;
        border-radius: 15px;
        font-size: 2em;
        font-weight: bold;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        z-index: 10000;
        pointer-events: none;
        animation: fadeInOut 3s ease-in-out forwards;
      }

      @keyframes fadeInOut {
        0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        10%, 90% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }

      .btn {
        padding: 12px 24px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-secondary {
        background: white;
        color: #667eea;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      }

      .btn:active {
        transform: translateY(0);
      }

      .tauri-badge {
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: rgba(255, 255, 255, 0.9);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.75em;
        color: #333;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      }

      .tauri-badge strong {
        color: #667eea;
      }

      /* Mobile gamepad styles */
      .snake-gamepad {
        display: none;
        position: fixed;
        right: 15px;
        bottom: 15px;
        z-index: 10001;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        gap: 6px;
        user-select: none;
      }

      @media (pointer: coarse) {
        .snake-gamepad {
          display: grid;
        }
      }

      .snake-gamepad button {
        padding: 0;
        font-size: 20px;
        color: #333;
        background: rgba(255, 255, 255, 0.9);
        border: 2px solid #667eea;
        border-radius: 8px;
        cursor: pointer;
        touch-action: manipulation;
      }

      .snake-gamepad button:active {
        background: #667eea;
        color: white;
      }


      .settings-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 24px;
        margin-top: 14px;
        justify-content: center;
        align-items: center;
      }

      .settings-control {
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
      }

      .settings-control label {
        font-weight: 600;
        font-size: 0.95em;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.25);
      }

      .settings-control select {
        padding: 10px 14px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        background: white;
        color: #667eea;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        outline: none;
      }

      .settings-control select:hover {
        box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      }

      .settings-control select:focus {
        box-shadow: 0 0 0 3px rgba(255,255,255,0.45), 0 6px 20px rgba(0,0,0,0.3);
      }


      .settings-control input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #667eea;
        cursor: pointer;
      }

      .settings-control.checkbox-control label {
        cursor: pointer;
        user-select: none;
      }

      /* Loading spinner */
      .loading {
        color: white;
        font-size: 1.5em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="game-header">
        <h1>🐍 Snake 2.0</h1>
        <div class="subtitle">Powered by Tauri - Lightweight & Fast</div>
      </div>

      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="current-score">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">High Score</div>
          <div class="stat-value" id="high-score">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Games Played</div>
          <div class="stat-value" id="games-played">0</div>
        </div>
      </div>

      <div id="game-container">
        <div id="game-area" tabindex="0"></div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="btn-new-game">New Game</button>
        <button class="btn btn-secondary" id="btn-pause">Pause</button>
        <button class="btn btn-secondary" id="btn-reset-stats">Reset Stats</button>
      </div>

      <div class="settings-bar">
        <div class="settings-control">
          <label for="select-difficulty">Difficulty:</label>
          <select id="select-difficulty" autocomplete="off">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="impossible">Impossible</option>
            <option value="rush">Rush</option>
          </select>
        </div>
        <div class="settings-control">
          <label for="select-theme">Theme:</label>
          <select id="select-theme" autocomplete="off">
            <option value="main" selected>Main</option>
            <option value="dark">Dark</option>
            <option value="matrix">Matrix</option>
            <option value="neon">Neon</option>
            <option value="golden">Golden</option>
          </select>
        </div>
        <div class="settings-control checkbox-control">
          <input type="checkbox" id="toggle-ai" />
          <label for="toggle-ai">AI Autoplay</label>
        </div>
      </div>

      <!-- Mobile gamepad -->
      <div class="snake-gamepad" id="snake-gamepad">
        <div></div>
        <button data-key="38">↑</button>
        <div></div>
        <button data-key="37">←</button>
        <button data-key="32">⏸</button>
        <button data-key="39">→</button>
        <div></div>
        <button data-key="40">↓</button>
        <div></div>
      </div>
    </div>

    <div class="tauri-badge">
      ⚡ Built with <strong>Tauri 2.0</strong>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
